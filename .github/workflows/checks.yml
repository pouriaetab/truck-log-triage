# Runs on every push and pull request: style check, then the tests. A red X on GitHub means do not merge.
name: checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install - requirements.txt
      - run: ruff check .
      - run: python -m pytest -v